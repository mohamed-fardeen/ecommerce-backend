<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>Testing Backend Connection</h1>
    <button onclick="testConnection()">Test API</button>
    <div id="result"></div>

    <script>
        async function testConnection() {
            try {
                const response = await fetch('https://ecommerce-backend-dtra.onrender.com/', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<h3>Success!</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<h3>Error!</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
